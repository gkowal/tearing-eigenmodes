[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[project]
name = "tearing-eigenmodes"
version = "0.1.0"
description = "Utilities for analyzing tearing instability eigenmodes"
dependencies = [
    "numpy",
    "scipy",
    "psecas",
    "sympy",
    "matplotlib"
]

[project.optional-dependencies]
dev = ["pytest", "mypy"]
